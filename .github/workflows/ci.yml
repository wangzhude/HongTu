name: CI

# 鸿图持续集成流水线：在标准 Ubuntu runner 上安装 Python 伴随端真实依赖（KLayout / Pydantic AI / AG-UI），
# 运行完整单元测试套件、跨端 ArkTS/Python 契约校验及仓库卫生守卫。
# HarmonyOS 设备构建与本地单测（hvigorw test / hvigorw assembleHap）依赖 DevEco Studio + HarmonyOS SDK，
# 在具备 SDK 的宿主环境中执行 entry/src/test Hypium 套件。

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  python-companion-and-contracts:
    name: Python 伴随端单测与跨端契约检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Create isolated companion virtualenv and install dependencies
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install -r python/requirements.txt

      - name: Run Python companion unit tests (including real KLayout DRC/LVS & isolated -I workers)
        run: |
          python/.venv/bin/python -m unittest discover -s python/tests -v

      - name: Verify cross-end ArkTS/Python contracts and Hypium test suite integrity
        run: |
          python/.venv/bin/python python/check_contracts.py

  repo-hygiene:
    name: 仓库卫生与源码静态守卫
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure no build artifacts or local venvs committed
        run: |
          if git ls-files | grep -E '\.(jpeg|jpg|png|log)$|^oh_modules/|^python/\.venv/|__pycache__/|build_log\.txt'; then
            echo "::error::检测到不应入库的生成物/二进制或本地虚拟环境（jpeg/png/log/oh_modules/.venv/build_log.txt）"
            exit 1
          fi
          echo "仓库卫生检查通过"

      - name: Verify Hypium localTest sources and ArkTS contract exports
        run: |
          test -f entry/src/test/List.test.ets
          test -f entry/src/test/LocalUnit.test.ets
          python3 -m py_compile python/bridge_entry.py python/verify_klayout_lvs.py python/check_contracts.py python/hongtu/*.py
